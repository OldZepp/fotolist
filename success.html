<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказ оформлен — ФотоЛист</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .success-mark {
      display: grid;
      place-items: center;
      width: 74px;
      height: 74px;
      margin: 0 auto 26px;
      border-radius: 50%;
      background: #e4eddf;
      color: #315a46;
      box-shadow: 0 10px 30px rgba(49,90,70,.1);
    }
    .success-mark svg { width: 43px; height: 43px; }
    .success-note { max-width: 680px; margin: 0 auto 28px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="shell nav">
      <a class="logo" href="index.html"><span class="logoicon">▧</span> фото<span>лист</span></a>
    </div>
  </header>
  <main class="shell legal" style="text-align:center">
    <div class="success-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 24.5L20.5 34L38 15" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="kicker">ПОДТВЕРЖДЕНИЕ</p>
    <h1>Заказ оформлен!</h1>
    <p class="success-note">Спасибо, что выбрали «ФотоЛист»! Ваша заявка отправлена через Яндекс Форму. Мы свяжемся с вами для подтверждения деталей и сроков печати.</p>
    <a href="index.html" class="btn">Вернуться на главную</a>
  </main>
</body>
</html>
